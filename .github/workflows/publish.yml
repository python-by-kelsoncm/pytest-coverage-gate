name: Publish to PyPI

on:
  push:
    tags:
      # Only exact releases (vX.Y.Z); the moving major tag (v1) must not publish.
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # required for setuptools-scm to read the git tag version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build
        run: pip install build

      # The moving major tag (v1) shares a commit with vX.Y.Z, so `git describe` can pick
      # either one. The trigger only matches vX.Y.Z, hence the ref name is the version.
      - name: Build package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          export SETUPTOOLS_SCM_PRETEND_VERSION="${TAG_NAME#v}"
          python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytest-coverage-gate
    permissions:
      id-token: write  # Required for OIDC trusted publishing
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
